# Alternative to Caddy: nginx in front of a plain Node process (see deploy/README.md, "Without Docker").
# WebSocket upgrade headers are essential: without them the live screens fall back to slow polling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name auction.example.com;

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append a client-supplied value
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                         # keep long-lived WebSocket connections open
        proxy_buffering off;
    }
}
# then:  sudo certbot --nginx -d auction.example.com   (adds HTTPS and the redirect)
